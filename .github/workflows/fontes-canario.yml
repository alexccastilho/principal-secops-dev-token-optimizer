name: Fontes canary

# scripts/fontes.py reads live facts from endoflife.date, OSV and the CISA KEV
# catalog. If one of them changes its format or a product slug disappears, the
# skill must not quietly start answering "not checked". This job asks every
# source once a week for the fields the script reads and opens (or updates) one
# issue when something broke. It never changes the repository.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fontes-canario
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Check every source
        id: check
        run: |
          set +e
          python -B skills/principal-secops-dev-token-optimizer/scripts/fontes.py \
            --cache-dir "$RUNNER_TEMP/fontes" --max-chars 60000 diagnostico > report.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or update the issue
        if: steps.check.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Canário de fontes: uma fonte mudou ou saiu do ar"
          body=$(printf 'Run: %s/%s/actions/runs/%s\n\n```\n%s\n```\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(head -c 60000 report.txt)")
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
